# Tema Guts ⚔ — configurações próprias do kitty
# (as cores vêm do Noctalia, gerado a partir de palette.json → themes/noctalia.conf)
font_family           MesloLGS Nerd Font Mono
bold_font             MesloLGS Nerd Font Mono Bold
font_size             11
background_opacity    0.88
background_blur       0
cursor_shape          block
cursor_blink_interval 0
cursor_trail          3
cursor_trail_decay    0.05 0.2
window_padding_width  18

tab_bar_edge          bottom
tab_bar_style         slant
tab_title_template    "⚔ {title}"
active_tab_font_style bold
