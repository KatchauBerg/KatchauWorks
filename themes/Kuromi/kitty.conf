# Tema Kuromi ♥ — configurações próprias do kitty
# (as cores vêm do Noctalia, gerado a partir de palette.json → themes/noctalia.conf)
font_family           MesloLGM Nerd Font
font_size             11.5
background_opacity    0.6
background_blur       1
cursor_shape          beam
cursor_trail          1
cursor_trail_decay    0.1 0.4
window_padding_width  25

tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_title_template    "♥ {title}"
